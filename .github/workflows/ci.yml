name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Check code formatting
      run: ruff format --check mandoline/ tests/

    - name: Run linting
      run: ruff check mandoline/ tests/

    - name: Run tests
      run: pytest

  mandoline-eval:
    name: Mandoline Evaluation
    runs-on: ubuntu-latest
    needs: test
    if: success()
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Mandoline CI
        run: npm install -g mandoline-ci

      - name: Run Mandoline evaluation
        env:
          MANDOLINE_API_KEY: ${{ secrets.MANDOLINE_API_KEY }}
        run: mandoline-ci run --verbose